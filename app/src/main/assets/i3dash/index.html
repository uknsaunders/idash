<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>i3 Dash</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
/* i3 Dash for the iDrive screen: drawn on the phone, sent to the car as pictures.
   Wide layout: top strip, car + stats on the left third, sat nav on the right two-thirds.
   No touch: the iDrive knob turns between pages. */
@font-face{font-family:"Inter";src:url(fonts/Inter-Regular.otf);font-weight:400}
@font-face{font-family:"Inter";src:url(fonts/Inter-Medium.otf);font-weight:500}
@font-face{font-family:"Inter";src:url(fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:"Inter";src:url(fonts/Inter-Bold.otf);font-weight:700}
/* the iDrive draws its own status bar across the top and its sidebar arc down the left,
   so everything is kept inside these margins */
:root{--safe-top:46px;--safe-left:40px;--safe-right:84px;--safe-bottom:6px}
:root{
  /* night: near-black with BMW blue. --accent fills the chosen item, --hi is blue text, --car tints the car row */
  --bg:#070b10; --bg2:#0f1721; --panel:#121a24; --panel2:#1a2532; --line:#2a3a4d; --ink:#eef3f8; --muted:#8a9bb0; --soft:var(--soft);
  --accent:#1c69d4; --accent2:#3d8df0; --accent-ink:#ffffff; --hi:#62adff; --car:#f5a03a; --edge:#a9cfff;
  --good:#2fd49a; --warn:#f2a73b; --bad:#ff6b6b;
  --veil1:rgba(24,33,44,.55); --veil2:rgba(10,14,19,.8); --glass:rgba(17,24,33,.62); --glassline:rgba(255,255,255,.08);
  --tint:rgba(255,255,255,.06); --tagbg:rgba(10,14,19,.75); --glow:#243245; --callbg:rgba(10,14,19,.74); --track:rgba(255,255,255,.12);
  --lift:0 0 0 rgba(0,0,0,0);
  --f-d:"Inter",system-ui,sans-serif; --f-b:"Inter",system-ui,sans-serif;
}
/* day: light silver and white with dark text, so it reads in sunshine */
body.daymap{
  --bg:#dfe5ec; --bg2:#f4f6f9; --panel:#ffffff; --panel2:#fbfcfd; --line:#bcc7d3; --ink:#101a25; --muted:#536378; --soft:#2f3f55;
  --accent:#1c69d4; --accent2:#3585ee; --accent-ink:#ffffff; --hi:#1257b8; --car:#c26400; --edge:#0f4fa8;
  --good:#0b8a5c; --warn:#a85f00; --bad:#d32f2f;
  --veil1:rgba(255,255,255,.9); --veil2:rgba(236,240,245,.97); --glass:rgba(255,255,255,.86); --glassline:rgba(0,0,0,.14);
  --tint:rgba(16,50,100,.08); --tagbg:rgba(255,255,255,.88); --glow:#ffffff; --callbg:rgba(244,247,250,.92); --track:rgba(0,0,0,.14);
  --lift:0 2px 6px rgba(20,40,70,.16);
}
[hidden]{display:none!important}
html{background:#070b10}
html,body{margin:0;height:100%;color:var(--ink);font-family:var(--f-b);overflow:hidden}
body{background:linear-gradient(180deg,var(--bg2),var(--bg))}
*{box-sizing:border-box}
.num{font-family:var(--f-d);font-variant-numeric:tabular-nums}
.lbl{font:600 16px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#app{display:grid;grid-template-rows:60px 1fr;height:100vh;width:100vw;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left)}
header{display:flex;align-items:flex-end;gap:14px;padding:0 6px 5px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font:700 18px var(--f-d)}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.tabs{display:flex;align-items:baseline;gap:16px;padding-bottom:4px;min-width:0}
.tabs b{font:700 27px var(--f-d);white-space:nowrap}
.tabs span{font:500 20px var(--f-b);color:var(--muted);white-space:nowrap}
.tabs span i{font-style:normal;color:var(--hi);font-weight:600}
.sp{flex:1}
.wxb{display:flex;align-items:center;gap:6px;margin-left:12px;font:600 28px var(--f-d)}
.wxi svg{width:32px;height:32px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.clock{font:600 20px var(--f-d)}
.body{position:relative;display:grid;grid-template-columns:50% 1fr;min-height:0}
.body.wide{grid-template-columns:0 1fr}
aside{position:relative;padding:8px 10px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);overflow:hidden;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.soc{font:700 56px var(--f-d);line-height:.85}.soc small{font-size:26px;color:var(--muted)}
.spd{font:600 40px var(--f-d);line-height:1;text-align:right}
.carzone{position:relative;flex:1 1 auto;min-height:0;display:flex;justify-content:center}
.ovl{position:absolute;left:2px;top:0}.ovr{position:absolute;right:2px;top:0;text-align:right}
.carzone .carwrap{flex:none;align-self:stretch;width:auto;max-width:none;margin:0}
.carwrap{position:relative;flex:1 1 auto;min-height:0;max-width:100%;margin:0 auto;aspect-ratio:857/498;background:radial-gradient(ellipse at 50% 60%,var(--glow),transparent 70%)}
.carwrap img{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;transform:translate(-50%,-50%);font:600 20px var(--f-d);background:var(--tagbg);border-radius:4px;padding:0 5px;white-space:nowrap}
.tag:empty{display:none}
.ty{display:none;position:absolute;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;border:5px solid var(--warn);box-shadow:0 0 16px var(--warn),inset 0 0 16px var(--warn);z-index:3}
.ty.low,.ty.bad{display:block}.ty.bad{border-color:var(--bad);box-shadow:0 0 16px var(--bad),inset 0 0 16px var(--bad)}
.ty i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 22px var(--f-d);white-space:nowrap;background:var(--tagbg);border-radius:5px;padding:0 6px;font-style:normal}
.dot{position:absolute;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);background:rgba(76,147,255,.5)}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.pbar .f{position:absolute;top:0;bottom:0}
.pbar .z{position:absolute;left:37.5%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.pscale{display:flex;justify-content:space-between;font-size:16px;color:var(--muted);margin-top:2px}
.m{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:7px;box-shadow:var(--lift);padding:4px 10px;min-width:0}
.m .k{font:600 18px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .v{font:600 32px var(--f-d);line-height:1.1;white-space:nowrap}
.m .v small{font:500 17px var(--f-b);color:var(--muted);margin-left:2px}
.frost{position:absolute;inset:0;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,var(--veil1),var(--veil2));backdrop-filter:blur(7px)}
.frost h2{margin:0;font:600 30px var(--f-d)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 16px;margin:0;font-size:23px}
.kv dt{color:var(--soft)}.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.np{position:absolute;right:12px;top:12px;width:min(56%,420px);display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border-radius:10px;background:var(--glass);border:1px solid var(--glassline);backdrop-filter:blur(8px);z-index:3}
.np img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:var(--panel2)}
.np .t{font:600 20px var(--f-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np .a{font:500 16px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .x{min-width:0;flex:1}.np .st{font:600 18px var(--f-d);color:var(--muted)}
.mus{display:flex;gap:16px;align-items:center;margin-top:4px}
.mus img{width:180px;height:180px;border-radius:12px;object-fit:cover;flex:none;background:var(--panel2);box-shadow:0 6px 24px rgba(0,0,0,.45)}
.mus .t{font:600 32px var(--f-d);line-height:1.1}.mus .a{font:500 23px var(--f-b);color:var(--soft);margin-top:4px}.mus .al{font:500 19px var(--f-b);color:var(--muted);margin-top:2px}
.src{display:inline-flex;align-items:center;gap:6px;font:600 16px var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.src i{width:8px;height:8px;border-radius:50%;background:var(--good)}.src i.p{background:var(--muted)}
.prog{height:5px;border-radius:3px;background:var(--track);overflow:hidden}.prog b{display:block;height:100%;background:var(--ink)}
.times{display:flex;justify-content:space-between;font:500 17px var(--f-d);color:var(--muted);margin-top:3px}
.hint{margin-top:auto;color:var(--muted);font-size:17px}
.nav{position:relative;min-width:0;overflow:hidden;background:var(--panel)}
#map{position:absolute;inset:0}
/* the next turn and the now-playing strip share the top of the map without touching */
.turn:not([hidden])~.np{width:min(40%,420px)}
.turn{position:absolute;left:12px;top:12px;max-width:54%;display:flex;gap:12px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:9px 14px}
.turn svg{width:44px;height:44px;flex:none;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.turn .d{font:700 36px var(--f-d);line-height:1}
.turn .i{font:600 21px var(--f-b)}
.eta{position:absolute;left:12px;bottom:12px;display:flex;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 14px}
.eta b{display:block;font:600 30px var(--f-d);line-height:1.05}
.puck{position:absolute;left:50%;top:72%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);display:grid;place-items:center;z-index:5}
.puck i{width:26px;height:26px;border-radius:50%;background:#1660d0;display:grid;place-items:center}
.puck svg{width:15px;height:15px;fill:#fff}
.mapmsg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:18px;text-align:center;max-width:70%}
.call{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:22px 26px;background:var(--callbg);backdrop-filter:blur(14px);border:1px solid var(--glassline);border-radius:12px}
.call .cn{font:700 46px var(--f-d);line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call .cs{font:500 22px var(--f-b);color:var(--soft)}
.call .cd{font:700 40px var(--f-d);color:var(--good);line-height:1}
.call .ci{width:58px;height:58px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.call .ci svg{width:32px;height:32px;fill:#fff}
.al-row{background:var(--tint);border-radius:9px;padding:6px 10px}
.al-app{font:600 14px var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.al-t{font:600 20px var(--f-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-x{font:500 16px var(--f-b);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;top:0;left:0;bottom:0;width:50%;z-index:9;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:2px solid var(--accent);padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.mt{display:flex;justify-content:space-between;align-items:baseline;font:700 23px var(--f-d);padding:0 8px 5px;border-bottom:1px solid var(--line);margin-bottom:2px}
.mt small{font:500 16px var(--f-b);color:var(--muted)}
.mi{height:46px;flex:none;border-radius:7px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 25px var(--f-b);background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line)}
.mi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mi small{font:500 17px var(--f-b);color:var(--muted);white-space:nowrap;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.mi b{font:700 26px var(--f-d);color:var(--muted);flex:none}
.mi.on{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:var(--edge);color:var(--accent-ink)}.mi.on small,.mi.on b{color:var(--accent-ink)}
.mi.dim{color:var(--muted);font-size:20px}
.cardbox{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:8px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.cardbox.tight .card{flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:6px 14px;min-height:0}
.cardbox.tight .card svg{width:36px;height:36px;flex:none}
.cardbox.tight .card>div{min-width:0}
.cardbox.tight .card .ct{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardbox.tight .card .cx{font-size:16px;margin-top:1px}
.card.dim{opacity:.55}
.card.dim svg{stroke:var(--muted)}
/* the music screens: artwork tiles like a streaming app, and a full now-playing screen */
.msc{position:absolute;inset:0;z-index:9;background:linear-gradient(180deg,var(--bg2),var(--bg));padding:8px 16px 10px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.msc .mh{display:flex;align-items:baseline;justify-content:space-between;font:700 27px var(--f-d);padding:0 4px 2px}
.msc .mh small{font:500 17px var(--f-b);color:var(--muted)}
.tgrid{--art:118px;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--art) + 22px),1fr));gap:4px 8px;align-content:start;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.tgrid::-webkit-scrollbar,.erows::-webkit-scrollbar{display:none}
/* the Music top level: compact chips with a picture on the left, like a streaming app's home */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 10px;align-content:start;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:12px;min-width:0;border-radius:11px;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));padding:6px 12px 6px 6px;height:76px;box-sizing:border-box}
.chip .ca{width:60px;height:60px;flex:none;border-radius:8px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--g1,#2b5fb8),var(--g2,#123064))}
.chip .ca svg{width:58%;height:58%;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip .ca .in{font:800 28px var(--f-d);color:#fff}
.chip>div:last-child{min-width:0}.chip .tt{font:700 21px var(--f-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip .ts{font:500 15px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:var(--edge);color:var(--accent-ink)}.chip.on .ts{color:var(--accent-ink)}
.chip.dim{opacity:.5}
.glabel{grid-column:1/-1;font:700 15px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 6px 0}
.tile{border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:5px;min-width:0;border:2px solid transparent}
.tile .ta{width:var(--art);height:var(--art);margin:0 auto;border-radius:10px;overflow:hidden;display:grid;place-items:center;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.35);background:linear-gradient(135deg,var(--g1,#2b5fb8),var(--g2,#123064))}
.tile .ta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .ta img.fv{object-fit:contain;background:#fff;padding:8%;box-sizing:border-box}
.tile .ta svg{width:46%;height:46%;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile .ta .in{font:800 calc(var(--art) * .36) var(--f-d);color:#fff}
.tile .tt{font:700 19px var(--f-d);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.tile .ts{font:500 15px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;margin-top:-3px}
.tile.on{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:var(--edge);color:var(--accent-ink)}
.tile.on .ts{color:var(--accent-ink)}
.tile.dim{opacity:.5}
.tile .tp{position:absolute;left:8px;right:8px;bottom:8px;height:5px;border-radius:3px;background:rgba(0,0,0,.5)}.tile .tp b{display:block;height:100%;border-radius:3px;background:#fff}
.erows{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.erow{display:flex;align-items:center;gap:14px;border-radius:10px;padding:5px 10px;border:2px solid transparent;flex:none}
.erow img,.erow .ea{width:62px;height:62px;border-radius:8px;object-fit:cover;flex:none;background:var(--panel2);display:grid;place-items:center}
.erow .ea svg{width:30px;height:30px;stroke:var(--hi);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.erow>div{min-width:0;flex:1}.erow .tt{font:600 22px var(--f-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.erow .ts{font:500 16px var(--f-b);color:var(--muted)}
.erow.on{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:var(--edge);color:var(--accent-ink)}.erow.on .ts{color:var(--accent-ink)}.erow.on .ea svg{stroke:var(--accent-ink)}
.erow.dim{opacity:.55}
.mini{display:flex;align-items:center;gap:12px;width:50%;border-radius:12px;padding:6px 12px;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));flex:none}
.mini img{width:52px;height:52px;border-radius:7px;object-fit:cover;flex:none;background:var(--panel2)}
.mini>div{min-width:0;flex:1}.mini .tt{font:700 20px var(--f-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini .ts{font:500 15px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .st{font:700 24px var(--f-d);color:var(--hi)}
.mini.on{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:var(--edge);color:var(--accent-ink)}.mini.on .ts,.mini.on .st{color:var(--accent-ink)}
.now{display:flex;gap:34px;align-items:center;flex:1;min-height:0;padding:4px 10px}
.now .nart{width:340px;height:340px;flex:none;border-radius:16px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.5);background:linear-gradient(135deg,#2b5fb8,#123064);display:grid;place-items:center}
.now .nart img{width:100%;height:100%;object-fit:cover}.now .nart svg{width:40%;height:40%;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.now .ni{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.now .ns{font:700 16px var(--f-b);letter-spacing:.09em;text-transform:uppercase;color:var(--hi)}
.now .nt{font:700 44px var(--f-d);line-height:1.08;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now .na{font:500 26px var(--f-b);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{display:flex;gap:18px;margin-top:14px}
.nb .b{display:flex;flex-direction:column;align-items:center;gap:6px;width:104px}
.nb .c{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.nb .c svg{width:40px;height:40px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nb .l{font:600 15px var(--f-b);color:var(--muted);white-space:nowrap}
.nb .b.on .c{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:var(--edge)}.nb .b.on .c svg{stroke:var(--accent-ink)}.nb .b.on .l{color:var(--ink)}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:10;font:600 22px var(--f-b);background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:8px 18px;white-space:nowrap}
/* the home screen: one card for each part of the app */
.home{position:absolute;inset:0;z-index:11;background:linear-gradient(180deg,var(--bg2),var(--bg));display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:10px;padding:10px 4px 6px}
.card{position:relative;border-radius:9px;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:var(--lift);padding:14px 18px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.card svg{width:54px;height:54px;stroke:var(--hi);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card .ct{font:700 31px var(--f-d);line-height:1.1}
.card .cx{font:500 19px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.card.car svg{stroke:var(--car)}
.card.on{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:var(--edge);color:var(--accent-ink)}
.card.on svg{stroke:var(--accent-ink)}.card.on .cx{color:var(--accent-ink)}
.card .cb{position:absolute;top:14px;right:16px;font:700 20px var(--f-d);background:var(--bad);color:#fff;border-radius:14px;padding:1px 11px}
.hometitle{font:600 21px var(--f-b);color:var(--muted);padding-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hometitle b{color:var(--ink);font-weight:700}
/* a new message drops in over the top of the screen for a few seconds */
.banner{position:absolute;left:12px;top:8px;width:calc(50% - 24px);z-index:12;display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:8px 16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.banner .ba{font:700 24px var(--f-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .bx{font:500 19px var(--f-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .bk{margin-left:auto;font:600 18px var(--f-b);color:var(--hi);white-space:nowrap}
.banner>div{min-width:0}
.leaflet-container{background:#141b23}
body.daymap .leaflet-container{background:#e9e6df}
body.daymap .maplibregl-ctrl-attrib{background:rgba(255,255,255,.7)!important;color:#333!important}body.daymap .maplibregl-ctrl-attrib a{color:#333!important}
.maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(10,14,19,.6)!important;color:var(--muted)!important}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
</style>

      </div>

    <section class="nav">

      </div>

    </section>
    <div class="home" id="home" hidden></div>
    <div class="menu" id="menu" hidden></div>

  </div>
</div>

<script src="lib/maplibre-gl.js"></script>

<script>
"use strict";
const $=s=>document.querySelector(s);
const _c=new Map();
function T(sel,v){v=String(v);if(_c.get(sel+'t')===v)return;_c.set(sel+'t',v);$(sel).textContent=v}
function H(sel,v){v=String(v);if(_c.get(sel+'h')===v)return;_c.set(sel+'h',v);$(sel).innerHTML=v}
function S(el,k,v){if(el.style[k]!==v)el.style[k]=v}
const N=window.I3Native||{speak(){},log(){},navigationEnded(){},menu(){return '{}'},navStarted(){},search(){},answer(){},hangup(){},dial(){},media(){},musicOpen(){},musicPick(){},audioList(){},audioPlay(){},audioStop(){},audioCommand(){},video(){return 'nocar'}};
const log=m=>{try{N.log(String(m))}catch(e){}};
// OpenStreetMap lookups (chargers, toilets, speed limits). In the car they go through the phone, which has
// time limits and tries backup servers; asked from the car screen directly, they could hang for ever.
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const osmWait={};let osmSeq=0;
window.i3osm=(id,j,problem)=>{const w=osmWait[id];if(!w)return;delete osmWait[id];clearTimeout(w.t);if(j)w.ok(j);else w.no(new Error(problem||'no answer'))};
async function overpass(q,what){
  if(typeof N.overpass==='function'){
    return new Promise((ok,no)=>{const id='q'+(++osmSeq);
      osmWait[id]={ok,no,t:setTimeout(()=>{delete osmWait[id];no(new Error('no answer in 90 seconds'))},90000)};
      N.overpass(id,q,what||'places')});
  }
  let last='no answer';
  for(const base of OVERPASS){
    const ac=typeof AbortController!=='undefined'?new AbortController():null,tm=ac&&setTimeout(()=>ac.abort(),15000);
    try{
      const r=await fetch(base+'?data='+encodeURIComponent(q),ac?{signal:ac.signal}:undefined);
      const t=await r.text();
      if(!r.ok){last=new URL(base).host+' HTTP '+r.status;log('overpass: '+last);continue}
      try{return JSON.parse(t)}catch(e){last=new URL(base).host+' sent "'+t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,60)+'"';log('overpass: '+last)}
    }catch(e){last=new URL(base).host+': '+(e.name==='AbortError'?'no answer in 15 seconds':e.message);log('overpass: '+last)}
    finally{if(tm)clearTimeout(tm)}
  }
  throw new Error(last);
}
const store={get(k,d){try{const v=localStorage.getItem('i3.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('i3.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- settings ---------- */
const USABLE_KWH=store.get('usableKwh',27.2);   // 94 Ah pack; 60 Ah = 18.8, 120 Ah = 37.9
const PAINTS=['mineral-grey','capparis-white','fluid-black','ionic-silver','laurus-grey','melbourne-red','imperial-blue','galvanic-gold','jucaro-beige'];
const PAINT_NAMES=['Mineral Grey','Capparis White','Fluid Black','Ionic Silver','Laurus Grey','Melbourne Red','Imperial Blue','Galvanic Gold','Jucaro Beige'];
const BELTS=['black','body','frozen-grey','i-blue'],BELT_NAMES=['Black','Body colour','Frozen Grey','BMW i Blue'];
let paint=store.get('paint',0); // index into body*4+belt
function paintCar(){const b=Math.floor(paint/4)%9,e=paint%4;$('#car').src='cars/'+PAINTS[b]+'--'+BELTS[e]+'.webp'}
paintCar();

/* ---------- live data from the car ---------- */
const D={};let miles=true,fahr=false;
const MI=0.621371;
const f=(v,d=0)=>v==null||isNaN(v)?'--':(+v).toFixed(d);
const dist=km=>miles?km*MI:km, du=()=>miles?'mi':'km';
const temp=c=>fahr?c*1.8+32:c, tu=()=>fahr?'°F':'°C';
const sm=(v,u)=>v==='--'?'--':v+'<small>'+u+'</small>';

/* journey: starts when the car first reports data, resets after 30 minutes without data */
let J=store.get('journey',null),trips=store.get('trips',[]);
function journeyTick(){
  const now=Date.now();
  if(!J||now-J.last>30*60000){
    if(J&&J.km>0.3){trips.unshift({start:J.start,end:J.last,km:J.km,kwh:J.kwh});trips=trips.slice(0,600);store.set('trips',trips)}
    J={start:now,last:now,km:0,kwh:0,odo0:D.odoKm??null,soc0:D.soc??null,lastSpeedT:now};
  }
  if(J.odo0==null&&D.odoKm!=null)J.odo0=D.odoKm;
  if(J.soc0==null&&D.soc!=null)J.soc0=D.soc;
  const dt=(now-J.lastSpeedT)/3600000;J.lastSpeedT=now;
  if(D.odoKm!=null&&J.odo0!=null&&D.odoKm-J.odo0>=1)J.km=D.odoKm-J.odo0;
  else if(D.speedKmh!=null)J.km+=D.speedKmh*Math.min(dt,0.01);
  if(D.soc!=null&&J.soc0!=null)J.kwh=Math.max(0,(J.soc0-D.soc)/100*USABLE_KWH);
  J.last=now;store.set('journey',J);
}
function kmPerKwh(){
  if(J&&J.km>3&&J.kwh>0.3)return J.km/J.kwh;
  if(D.avgConsumption){const u=String(D.avgConsumptionUnit||'');if(/MI|MPKWH|MILE/i.test(u))return D.avgConsumption/MI;return 100/D.avgConsumption}
  return 6.3;
}

window.i3feed=function(d){
  const ocmWas=D.ocmKey;
  Object.assign(D,d);
  // a key saved (or changed) while driving: fetch chargers again now, with availability
  if(D.ocmKey!==ocmWas&&D.ocmKey){chgAt=null;chgTry=0}
  if(D.units){const [dd,tt]=String(D.units).split(',');miles=dd==='Miles';fahr=tt==='FAHRENHEIT'}
  journeyTick();render();
  if(D.lat!=null)onPosition(D.lat,D.lon,D.heading);
  if(menu&&(menu.kind==='now'||menu.top))drawMenu();     // the now-playing screen and mini player follow the music
};

/* ---------- pages, turned with the iDrive knob ---------- */
const PAGES=['Car','Music','Call','Chargers','Journey','Alerts','Map','Info'];let page=0,home=true,homeSel=0;
window.i3knob=function(dir){
  if(menu){menu.sel=Math.max(0,Math.min(menu.items.length-1,menu.sel+(dir>0?1:-1)));drawMenu();menuAlive();return}
  if(home){homeSel=Math.max(0,Math.min(CARDS.length-1,homeSel+(dir>0?1:-1)));drawHome();return}
  if(hasOptions())sectionMenu();      // a turn brings up the same list as a press
};
window.i3shown=function(){if(PAGES[page]==='Info'){page=0;showPage()}};
function showPage(){
  drawTitle();
  // the Map page uses the whole width, except while the menu has the left half
  const wasWide=$('#body').classList.contains('wide'),isWide=PAGES[page]==='Map'&&!menu;
  $('#body').classList.toggle('wide',isWide);
  if(wasWide!==isWide){try{map&&map.resize();flat&&flat.invalidateSize();placeCamera()}catch(e){}}
  drawPanel();drawNowPlaying();drawHome();
}
// the line at the top of every section: its name, and what the knob does there
const TITLES={Map:'Navigate',Info:'Settings',Alerts:'Phone alerts',Journey:'Journeys and costs',Chargers:'Chargers nearby'};
function hasOptions(){const p=PAGES[page];return !!D.call||p==='Music'||p==='Map'||p==='Call'||p==='Info'||(p==='Chargers'&&chargers.length>0)||(p==='Alerts'&&(D.notes||[]).length>0)}
function drawTitle(){const p=PAGES[page];H('#tabs',`<b>${TITLES[p]||p}</b><span><i>Press the knob</i> for ${hasOptions()?'options and Home':'the Home screen'}</span>`)}
// the car is under way: message text stays off the screen and long lists get shorter
const moving=()=>(D.speedKmh||0)>3;
const MOVING_ROWS=12;
function drawPanel(){
  const p=PAGES[page],el={set innerHTML(v){H('#panel',v)}};
  if(p==='Chargers'){
    const near=nearChargers(5);
    const rows=near.length?near.map(n=>`<div class="al-row" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><div class="al-t">${esc(n.c.name)}</div><div class="al-app" style="white-space:nowrap">${esc(fmtD(n.d*1.25))}${n.c.info?' · '+esc(n.c.info):''}</div></div>`).join(''):
      `<div style="color:var(--soft);font-size:20px">${pos?'Looking for charging points nearby…':'Waiting for the car\'s position.'}</div>`;
    el.innerHTML=`<div class="frost"><h2>Chargers nearby</h2><div class="al">${rows}</div><div class="hint">${near.length?'<b style="color:var(--hi)">Press the knob</b> to drive to one · ':''}${D.soc!=null?f(D.soc)+'% in the battery':''}</div></div>`;
  }else if(p==='Journey'){
    const all=trips.slice();if(J&&J.km>0.3)all.unshift({start:J.start,km:J.km,kwh:J.kwh,now:true});
    const now=Date.now(),day=864e5,midnight=new Date().setHours(0,0,0,0);
    const sum=(a,b)=>{let km=0,kwh=0;for(const t of all)if(t.start>=a&&t.start<b){km+=t.km;kwh+=t.kwh}return{km,kwh}};
    const price=(D.tariffP!=null?D.tariffP:28)/100*1.1;      // pounds per kWh, plus about 10% charging losses
    const tiles=[['Today',sum(midnight,now+1)],['7 days',sum(now-7*day,now+1)],['30 days',sum(now-30*day,now+1)]].map(([k,t])=>{
      const cost=t.kwh*price,d=dist(t.km);
      return `<div class="m"><div class="k">${k}</div><div class="v">${f(d,0)}<small>${du()}</small></div><div class="k">£${cost.toFixed(2)}${d>1?' · '+Math.round(cost*100/d)+'p/'+du():''}</div></div>`}).join('');
    const eff=[];for(let i=13;i>=0;i--){const t=sum(midnight-i*day,midnight-i*day+day);eff.push(t.kwh>0.3&&t.km>1?dist(t.km)/t.kwh:null)}
    const vals=eff.filter(v=>v!=null),mx=Math.max(1,...vals),avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
    const bars=eff.map((v,i)=>v==null?'':`<rect x="${i*30+3}" y="${(60-v/mx*56).toFixed(1)}" width="24" height="${(v/mx*56).toFixed(1)}" rx="3" fill="${v>=avg?'#19c37d':'#4c93ff'}"/>`).join('');
    const rows=all.slice(0,2).map(r=>`<div class="m" style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-weight:600">${r.now?'This journey':new Date(r.start).toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'})}</div>
      <div class="k">${f(dist(r.km),1)} ${du()} · ${f(r.kwh,1)} kWh · £${(r.kwh*price).toFixed(2)}</div></div>
      <div class="v">${r.km>0.5&&r.kwh>0.1?f(dist(r.km)/r.kwh,1)+'<small>'+du()+'/kWh</small>':'--'}</div></div>`).join('');
    el.innerHTML=`<div class="frost"><h2>Journeys &amp; costs</h2><div class="g3">${tiles}</div>
      <div><div class="k" style="color:var(--muted);font-size:16px">${du()}/kWh each day, last 14 days${avg?' · average '+avg.toFixed(1):''}</div><svg viewBox="0 0 420 62" style="width:100%;height:62px">${bars}</svg></div>
      ${rows}<div class="hint">Battery energy used + 10% charging losses, at ${f(price/1.1*100,0)}p/kWh (set on the phone)</div></div>`;
  }else if(p==='Music'){
    const m=D.media,art=artUrl||'';
    if(!m||!m.title){el.innerHTML=`<div class="frost"><h2>Music</h2><div style="color:var(--soft);font-size:18px">${D.mediaPermission===false?'Open the i3D app on your phone and finish the setup list to show what is playing.':'Nothing playing.'}</div>
      <div style="color:var(--muted);font-size:17px">Press the knob to choose an app and a playlist.</div></div>`;return}
    const pct=m.dur>0?Math.min(100,m.pos/m.dur*100):0;
    el.innerHTML=`<div class="frost"><div class="src"><i class="${m.playing?'':'p'}"></i>${esc(m.app||'Music')} · ${m.playing?'Playing':'Paused'}</div>
      <div class="mus">${art?`<img src="${art}" alt="">`:'<img alt="">'}<div style="min-width:0"><div class="t">${esc(m.title)}</div><div class="a">${esc(m.artist||'')}</div><div class="al">${esc(m.album||'')}</div></div></div>
      ${m.dur>0?`<div><div class="prog"><b style="width:${pct.toFixed(1)}%"></b></div><div class="times"><span>${mmss(m.pos)}</span><span>${mmss(m.dur)}</span></div></div>`:''}
      <div class="hint"><b style="color:var(--hi)">Press the knob</b> to pause, skip or choose a playlist</div></div>`;
  }else if(p==='Call'){
    const d=menuData(),people=d.contacts.concat(d.recentCalls.filter(r=>!knows(d.contacts,r.number)).map(r=>Object.assign({note:'recent'},r))).slice(0,5);
    const rows=people.length?people.map(x=>`<div class="al-row" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><div class="al-t">${esc(x.name)}</div><div class="al-app">${(x.numbers||[]).length>1?x.numbers.length+' numbers':esc(x.note||'')}</div></div>`).join(''):
      `<div style="color:var(--soft);font-size:20px">${d.canSeeContacts?'No favourites or recent calls yet. Press the knob for all contacts.':'Open the i3D app on your phone and finish the setup list to call from here.'}</div>`;
    el.innerHTML=`<div class="frost"><h2>Call</h2><div class="al">${rows}</div><div class="hint"><b style="color:var(--hi)">Press the knob</b> to choose who to call</div></div>`;
  }else if(p==='Alerts'){
    const n=D.notes||[];
    const rows=n.length?n.slice(0,5).map(x=>`<div class="al-row"><div class="al-app">${esc(x.app)} · ${new Date(x.when).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div class="al-t">${esc(x.title||x.text)}</div>${x.title&&x.text&&!moving()?`<div class="al-x">${esc(x.text)}</div>`:''}</div>`).join(''):
      `<div style="color:var(--soft);font-size:20px">${D.notes===null||D.notes===undefined?'Open the i3D app on your phone and finish the setup list to see your alerts here.':'No new alerts.'}</div>`;
    el.innerHTML=`<div class="frost"><h2>Phone alerts</h2><div class="al">${rows}</div><div class="hint" style="font-size:15px">${moving()?'Message text is hidden while driving · press the knob to hear it':'Newest first · press the knob to hear or answer them'}</div></div>`;
  }else if(p==='Info'){
    const b=Math.floor(paint/4)%9,e=paint%4;
    el.innerHTML=`<div class="frost" style="backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(180deg,transparent 50%,var(--bg) 64%);justify-content:flex-end">
      <h2>${PAINT_NAMES[b]}</h2><div style="color:var(--soft)">${BELT_NAMES[e]} bonnet &amp; roof</div>
      <div class="hint" style="margin-top:6px;font-size:15px;color:var(--soft)">Press the knob for display, colour and battery</div></div>`;
  }else el.innerHTML='';
}
const WX_SVG={
 sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
 cloud:'<path d="M6.5 19h11a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.4 10.1 4.4 4.4 0 0 0 6.5 19z"/>',
 partly:'<circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M2 8h1.5M3.8 3.8l1 1M12.2 3.8l-1 1"/><path d="M9 20h8.5a3.5 3.5 0 0 0 .4-6.97A5 5 0 0 0 9.3 12.8 3.7 3.7 0 0 0 9 20z"/>',
 rain:'<path d="M6.5 15h11a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.4 6.1 4.4 4.4 0 0 0 6.5 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',

/* tyre pressures: found by name among whatever tyre-related data the car sends, shown only when low */
const TY_LOW=1.9,TY_BAD=1.6;
function tyreScan(){
  const out={};
  const walk=(o,path)=>{
    if(o&&typeof o==='object'){for(const k in o)walk(o[k],path+'.'+k);return}
    if(typeof o!=='number'||[0,255,1023,4095,65535].includes(o))return;
    const w=path.replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().split(/[^a-z]+/).filter(Boolean);
    if(w.some(x=>/^(temp|temperature|warn|warning|status|state|flag|mode|threshold|target|setpoint)$/.test(x)))return;
    const has=a=>w.some(x=>a.includes(x));
    const fr=has(['front','fl','fr','vl','vr','vorn','vorne']),re=has(['rear','back','rl','rr','hl','hr','hinten']);
    const le=has(['left','fl','rl','vl','hl','links','l']),ri=has(['right','fr','rr','vr','hr','rechts','r']);
    if(fr===re||le===ri)return;
    out[(fr?'f':'r')+(le?'l':'r')]=o>=100?o/100:(o>=10?o/14.504:o);   // kPa, psi or bar
  };
  for(const k in D)if(k.startsWith('tyre:'))walk(D[k],k.slice(5));
  return out;
}
function drawTyres(){
  const v=tyreScan();
  for(const pos of ['fl','fr','rl','rr']){
    const el=$('#ty-'+pos),b=v[pos],low=b!=null&&b<TY_LOW;
    const cls='ty'+(low?(b<TY_BAD?' bad':' low'):'');

  }
}
function tyreInfo(){

let chargers=[],chgAt=null,chgTry=0,chgBusy=false,chgLayer=null,chgLive=false,chgSrc='';
// Open Charge Map's connections carry a reported status per plug where the operator shares it;
// not every network reports live, so this is "as reported", not guaranteed accurate this second.
// Open Charge Map status ids, used when an answer carries only StatusTypeID and not the StatusType object
const OCM_STATUS={0:['Unknown',null],10:['Available',true],20:['In use',true],30:['Temporarily unavailable',false],
  50:['Operational',true],75:['Partly operational',true],100:['Not operational',false],150:['Planned',false],200:['Removed',false],210:['Removed',false]};
function ocmStatus(o){
  if(o&&o.StatusType&&o.StatusType.Title)return {title:o.StatusType.Title,ok:o.StatusType.IsOperational};
  const s=o&&o.StatusTypeID!=null?OCM_STATUS[o.StatusTypeID]:null;
  return s&&o.StatusTypeID!==0?{title:s[0],ok:s[1]}:null;
}
function parseOcm(list){
  return (list||[]).map(p=>{
    const a=p.AddressInfo||{},conns=p.Connections||[];
    if(a.Latitude==null||a.Longitude==null)return null;
    const total=p.NumberOfPoints||conns.length||1;
    const st=conns.map(ocmStatus).filter(x=>x&&x.title!=='Unknown');
    let avail=null;
    const inUse=st.filter(x=>x.title==='In use').length,free=st.filter(x=>x.title==='Available').length;
    if(inUse||free)avail=free+' free, '+inUse+' in use';
    else if(st.length){const up=st.filter(x=>x.ok).length;avail=up+' of '+st.length+' reported working'}
    else{const ps=ocmStatus(p);if(ps&&ps.title!=='Unknown')avail=ps.title}
    const kw=Math.max(0,...conns.map(c=>c.PowerKW||0));
    let info=total+(total>1?' points':' point');
    if(kw)info+=' · '+Math.round(kw)+'kW';
    if(avail)info+=' · '+avail;
    return {lon:a.Longitude,lat:a.Latitude,name:(a.Title||'Charging point'),info};
  }).filter(Boolean);
}

// battery detail: a plain read-out, nothing here to choose

function navMenu(){

// calls a person. Someone with more than one number gets a list to pick from first
function ring(c,number){
  if(!menuData().canCall){closeMenu();toast('Allow calls in the i3D phone app first');return}
  const nums=c.numbers||[];
  if(!number&&nums.length>1){
    openMenu('Call '+c.name,[backTo(callMenu)].concat(nums.map(x=>({label:x.label||'Number',note:x.number,act(){ring(c,x.number)}}))),1);return}
  closeMenu();N.dial(number||c.number,c.name||'');toast('Calling '+c.name);
}
const numNote=(c,note)=>(c.numbers||[]).length>1?c.numbers.length+' numbers':note;
// top level: a few cards to choose between. The scrolling lists of names stay lists (recentsMenu, everyoneMenu).
function callMenu(){
  const d=menuData(true),cards=[{label:'‹ Home screen',icon:'Home',act:goHome}];
  const missed=d.recentCalls.filter(r=>r.missed).length;
  const top=d.contacts[0];
  cards.push({label:'Recents',icon:'Recents',note:missed?missed+' missed':(top?top.name+' · favourite':'Favourites & recent'),act:recentsMenu});
  if(d.everyone.length){
    cards.push({label:'Speak a name',icon:'Voice',note:'voice',act(){hear('name')}});
    cards.push({label:'All contacts',icon:'Recents',note:d.everyone.length+' people',act:everyoneMenu});
  }else if(!d.canSeeContacts)cards.push({label:'All contacts',icon:'Recents',note:'finish setup on phone',dim:1});
  cards.push({label:'Type a name…',icon:'Keyboard',note:'letter wheel',act(){closeMenu();N.search()}});
  openCardMenu('Call',cards,1);
}
// favourites, missed and recent calls together, nearest first - a scrollable list, not cards
function recentsMenu(){
  const d=menuData(true),it=[backTo(callMenu)],head=it.length;
  d.contacts.forEach(c=>it.push({label:c.name,note:numNote(c,'favourite'),more:0,act(){ring(c)}}));
  const missed=d.recentCalls.filter(r=>r.missed);
  missed.forEach(c=>it.splice(head+missed.indexOf(c),0,{label:c.name,note:'missed call',act(){ring(c)}}));
  d.recentCalls.filter(r=>!r.missed&&!knows(d.contacts,r.number)).forEach(c=>it.push({label:c.name,note:'recent',act(){ring(c)}}));
  if(it.length===head)it.push({label:d.canSeeContacts?'No favourites or recent calls yet':'Finish the setup list in the i3D phone app',dim:1});
  openMenu('Recents',it,head);
}
function everyoneMenu(){
  const it=[backTo(callMenu)];
  const all=menuData().everyone,cut=moving()&&all.length>MOVING_ROWS;
  if(cut)it.push({label:'Speak a name',note:'voice',act(){hear('name')}});
  (cut?all.slice(0,MOVING_ROWS):all).forEach(c=>it.push({label:c.name,note:numNote(c,''),act(){ring(c)}}));
  if(cut)it.push({label:'The full list shows when parked',dim:1});
  openMenu('All contacts',it,1);
}
/* ---------- music ----------
   Two kinds of source, shown in two groups:
   - chosen in the car: radio and podcasts, from open directories, played by i3D's own player on the phone
   - started on the phone when parked: Spotify, Amazon Music, BBC Sounds and the rest only list their
     music for apps they approve, so they're picked on the phone; the car then shows and controls them.
   The screens look like a streaming app: artwork tiles, a mini player at the bottom left for whatever
   was last playing, and a full now-playing screen with the controls on the knob. */
const GENRES=['Pop','Rock','News','Talk','Classical','Jazz','Dance','Country','80s','Christian','Sport','Chill'];
const RECENT_MAX=12,FAV_MAX=24;
function openTiles(title,items,sel,opts){$('#toast').hidden=true;menu=Object.assign({title,items,sel:Math.min(sel||0,Math.max(0,items.length-1)),kind:'tiles'},opts||{});drawMenu();menuAlive()}
// saved stations, followed shows and recently played, kept in the car page's own storage
const keep=(k,item,max)=>{const l=store.get(k,[]).filter(x=>x.id!==item.id);l.unshift(item);store.set(k,l.slice(0,max))};
const has=(k,id)=>store.get(k,[]).some(x=>x.id===id);
function toggle(k,item){if(has(k,item.id)){store.set(k,store.get(k,[]).filter(x=>x.id!==item.id));return false}keep(k,item,FAV_MAX);return true}
window.i3toast=t=>toast(t);

// top level: the two groups, then the mini player for what was last playing
let phoneApps=null;       // the phone's music apps, as last listed by the phone
function musicMenu(sel){musicTop(sel);N.musicOpen()}
function musicTop(sel){
  const favs=store.get('radio.favs',[]),subs=store.get('pod.subs',[]);
  const it=[{label:'‹ Home',icon:'Home',group:'Choose in the car',act:goHome},
    {label:'Radio',icon:'Radio',note:favs.length?favs.length+' saved':'Near you & UK',act:()=>radioMenu()},
    {label:'Podcasts',icon:'Podcast',note:subs.length?subs.length+' shows':'UK top shows',act:()=>podcastMenu()}];
  if(menuData().videos.length)it.push({label:'Video',icon:'Video',note:'parked only',act:videoMenu});
  const grp=moving()?'Pull over to choose these on your phone':'Start on your phone when parked, then control here';
  if(phoneApps===null)it.push({label:'Finding apps…',icon:'Music',group:grp,dim:1});
  else if(!phoneApps.length)it.push({label:'No music apps found',icon:'Music',group:grp,dim:1});
  else phoneApps.forEach((label,i)=>{const name=String(label).replace(/ \(playing\)$/,''),on=/\(playing\)$/.test(label);
    it.push({label:name,initial:1,group:i?undefined:grp,note:on?'playing now':'on the phone',act(){waiting(name);N.musicPick(i)}})});
  const m=D.media;
  if(m&&m.title)it.push({mini:1,label:m.title,act:()=>nowMenu(()=>musicMenu())});
  openTiles('Music',it,sel==null?1:sel,{top:true});
}
// the phone answers musicOpen and musicPick here
window.i3music=function(r){
  if(r.played){if(menu&&menu.wait)closeMenu();toast('Playing');return}
  if(r.top){
    phoneApps=(r.rows||[]).filter(x=>x!=='No music apps found');
    if(menu&&(menu.top||menu.wait))musicTop(menu.top?menu.sel:undefined);
    return;
  }
  if(!menu||!menu.wait)return;      // the driver moved on while it was loading
  // inside one phone app's own folders: a scrollable list
  const it=[backTo(musicMenu)];
  (r.rows||[]).forEach((label,i)=>it.push({label,act(){waiting(menu.title);N.musicPick(i)}}));
  openMenu(menu.title,it,it.length>1?1:0);
};

// radio: ways in first, then saved and recent stations
const stationTile=(x,group,back)=>({label:x.title,note:x.sub,art:x.art,icon:'Radio',fav:1,group,act(){playItem(x,back)}});
function radioMenu(sel){
  const it=[{label:'‹ Music',icon:'Back',act:()=>musicMenu(1)},
    {label:'Speak a station',icon:'Voice',note:'say its name',act(){hear('radio')}},
    {label:'Near you',icon:'Near',note:'local stations',act(){loadList('near',JSON.stringify(pos?{lat:pos[1],lon:pos[0]}:{}),'Near you',radioMenu)}},
    {label:'UK top',icon:'Chart',note:'most played',act(){loadList('uk','','UK top stations',radioMenu)}},
    {label:'Genres',icon:'Tag',note:GENRES.slice(0,3).join(', ')+'…',act:genreMenu}];
  const first=it.length,favs=store.get('radio.favs',[]),rec=store.get('radio.recent',[]).filter(x=>!favs.some(f=>f.id===x.id));
  favs.forEach((x,i)=>it.push(stationTile(x,i?undefined:'Your stations',()=>radioMenu())));
  rec.forEach((x,i)=>it.push(stationTile(x,i?undefined:'Recently played',()=>radioMenu())));
  openTiles('Radio',it,sel!=null?sel:it.length>first?first:2);
}
function genreMenu(){
  const it=[{label:'‹ Radio',icon:'Back',act:()=>radioMenu(4)}];
  GENRES.forEach(g=>it.push({label:g,icon:'Tag',act(){loadList('genre',g,g+' radio',genreMenu)}}));
  openTiles('Genres',it,1);
}

// podcasts: ways in, then episodes to carry on with, then followed shows
const showTile=(x,group)=>({label:x.title,note:x.sub,art:x.art,icon:'Podcast',group,act(){loadList('episodes',JSON.stringify(x),x.title,podcastMenu)}});
const showOf=e=>({kind:'podcast',id:e.feed,title:e.show,sub:'',art:e.art,feed:e.feed});
const follows=feed=>store.get('pod.subs',[]).some(x=>x.id===feed||(x.feed&&x.feed===feed));
function follow(show){
  if(follows(show.feed)){store.set('pod.subs',store.get('pod.subs',[]).filter(x=>x.id!==show.feed&&x.feed!==show.feed));toast('Unfollowed '+show.title);return}
  keep('pod.subs',Object.assign({},show,{id:show.feed}),FAV_MAX);toast('Following '+show.title);
}
function podcastMenu(sel){
  const it=[{label:'‹ Music',icon:'Back',act:()=>musicMenu(2)},
    {label:'Speak a show',icon:'Voice',note:'say its name',act(){hear('podcast')}},
    {label:'UK top shows',icon:'Chart',note:'from the charts',act(){loadList('charts','','UK top podcasts',podcastMenu)}}];
  const first=it.length,rec=store.get('pod.recent',[]),subs=store.get('pod.subs',[]);
  rec.slice(0,6).forEach((e,i)=>it.push({label:e.title,note:e.show,art:e.art,icon:'Podcast',group:i?undefined:'Continue listening',act(){playItem(e,()=>podcastMenu())}}));
  subs.forEach((x,i)=>it.push(showTile(x,i?undefined:'Your shows')));
  openTiles('Podcasts',it,sel!=null?sel:it.length>first?first:2);
}

// a list from the phone: stations, shows or episodes. Kept, so Back from the player returns to it
let listReq=0;
function loadList(kind,arg,title,back){
  openTiles(title,[{label:'‹ Back',icon:'Back',act:()=>back()},{label:'Loading…',icon:'Recents',dim:1}],1,{wait:true,listKind:kind,listArg:String(arg||''),back,req:++listReq});
  N.audioList(kind,String(arg||''));
}
window.i3audio=function(r){
  if(!menu||!menu.wait||menu.listKind!==r.kind||menu.listArg!==r.arg)return;     // the driver moved on
  showAnswer(r,menu.title,menu.back);
};
function showAnswer(r,title,back,sel){
  const items=r.items||[],it=[{label:'‹ Back',icon:'Back',act:()=>back()}],again=()=>showAnswer(r,title,back,menu&&menu.sel);
  if(r.kind==='episodes'){
    let show={};try{show=JSON.parse(r.arg)}catch(e){}
    if(items.length&&!show.feed)show.feed=items[0].feed;
    if(show.feed)it.push({label:follows(show.feed)?'Following '+show.title:'Follow '+show.title,icon:'Heart',note:'adds it to Your shows',act(){follow(show);again()}});
    if(r.error)it.push({label:r.error,icon:'Recents',dim:1});else if(!items.length)it.push({label:'No episodes found',icon:'Recents',dim:1});
    items.forEach(e=>it.push({label:e.title,note:e.sub+(e.resume?' · started':''),art:e.art,icon:'Podcast',act(){playItem(e,again)}}));
    openTiles(title,it,sel!=null?sel:it.length>2?2:1,{rows:true});
    return;
  }
  if(r.error)it.push({label:r.error,icon:'Recents',dim:1});else if(!items.length)it.push({label:'Nothing found',icon:'Recents',dim:1});
  items.forEach(x=>it.push(x.kind==='podcast'?showTile(x):stationTile(x,undefined,again)));
  openTiles(title,it,sel!=null?sel:1);
}

// starts i3D's own player, and shows the now-playing screen straight away
let nowItem=null,nowAt=0;
function playItem(x,back){
  N.audioPlay(JSON.stringify(x));
  keep(x.kind==='station'?'radio.recent':'pod.recent',x,RECENT_MAX);
  nowMenu(back,x);
}
// whether the now-playing screen is about i3D's own player: the phone says so, or it was asked a moment ago
const ownNow=()=>{const m=D.media;return !!(m&&m.mine)||(!!nowItem&&Date.now()-nowAt<6000)};
// what i3D's player has: just asked for, until the phone has caught up; then what the phone reports
const ownItem=()=>{const m=D.media||{};if(nowItem&&Date.now()-nowAt<6000&&!(m.mine&&m.item&&m.item.id===nowItem.id))return nowItem;return (m.mine&&m.item)||nowItem};
function nowButtons(){
  const m=D.media||{},own=ownNow(),it=own?ownItem():null,fresh=own&&!(m.mine&&m.item&&it&&m.item.id===it.id);
  const on=fresh?true:!!m.playing;
  const back={label:'Back',icon:'Back',act(){(menu.back||musicMenu)()}};
  const pp={label:on?'Pause':'Play',icon:on?'Pause':'Play',act(){if(own)N.audioCommand('toggle');else N.media('toggle')}};
  if(it&&it.kind==='station')return [back,pp,
    {label:'Stop',icon:'Stop',act(){N.audioStop();nowItem=null;(menu.back||musicMenu)()}},
    {label:has('radio.favs',it.id)?'Saved':'Save',icon:'Heart',act(){toast(toggle('radio.favs',it)?'Saved to Your stations':'Removed from Your stations');drawMenu()}}];
  if(it)return [back,{label:'Back 15s',icon:'Back15',act(){N.audioCommand('back')}},pp,{label:'On 30s',icon:'Fwd30',act(){N.audioCommand('fwd')}},
    {label:follows(it.feed)?'Following':'Follow',icon:'Heart',act(){follow(showOf(it));drawMenu()}},
    {label:'Episodes',icon:'List',act(){loadList('episodes',JSON.stringify(showOf(it)),it.show||'Episodes',podcastMenu)}}];
  return [back,{label:'Back 15s',icon:'Back15',act(){N.media('back')}},{label:'Previous',icon:'Prev',act(){N.media('prev')}},pp,
    {label:'Next',icon:'Next',act(){N.media('next')}},{label:'On 30s',icon:'Fwd30',act(){N.media('fwd')}}];
}
function nowMenu(back,item){
  if(item){nowItem=item;nowAt=Date.now()}
  $('#toast').hidden=true;
  const items=nowButtons();
  menu={title:'Now playing',items,sel:Math.max(0,items.findIndex(b=>b.icon==='Play'||b.icon==='Pause')),kind:'now',back};
  drawMenu();menuAlive();
}

/* drawing the music screens */
const hue=t=>{let h=7;for(const c of String(t))h=(h*31+c.charCodeAt(0))%360;return h};
function tileHtml(it,i){
  const h=hue(it.label),g=`--g1:hsl(${h},55%,44%);--g2:hsl(${(h+40)%360},60%,20%)`;
  const face=it.initial?`<span class="in">${esc(String(it.label).charAt(0).toUpperCase())}</span>`:`<svg viewBox="0 0 24 24">${ICON[it.icon]||ICON.Music}</svg>`;
  const img=it.art?`<img class="${it.fav?'fv':''}" src="${esc(it.art)}" alt="" onerror="this.remove()">`:'';
  const prog=it.prog?`<div class="tp"><b style="width:${Math.round(it.prog*100)}%"></b></div>`:'';
  return `<div class="tile${i===menu.sel?' on':''}${it.dim?' dim':''}"><div class="ta" style="${g}">${face}${img}${prog}</div><div class="tt">${esc(it.label)}</div><div class="ts">${it.note?esc(it.note):'&nbsp;'}</div></div>`;
}
function chipHtml(it,i){
  const h=hue(it.label),g=`--g1:hsl(${h},55%,44%);--g2:hsl(${(h+40)%360},60%,20%)`;
  const face=it.initial?`<span class="in">${esc(String(it.label).charAt(0).toUpperCase())}</span>`:`<svg viewBox="0 0 24 24">${ICON[it.icon]||ICON.Music}</svg>`;
  return `<div class="chip${i===menu.sel?' on':''}${it.dim?' dim':''}"><div class="ca" style="${g}">${face}</div><div><div class="tt">${esc(it.label)}</div>${it.note?`<div class="ts">${esc(it.note)}</div>`:''}</div></div>`;
}
function miniHtml(i){
  const m=D.media||{},art=m.mine&&m.item&&m.item.art?m.item.art:artUrl;
  return `<div class="mini${i===menu.sel?' on':''}">${art?`<img src="${esc(art)}" alt="">`:'<img alt="">'}<div><div class="tt">${esc(m.title||menu.items[i].label)}</div><div class="ts">${esc([m.artist,m.app].filter(Boolean).join(' · ')||'last playing')}</div></div><span class="st">${m.playing?'▶':'❚❚'}</span></div>`;
}
function drawMusicScreen(){
  if(menu.kind==='now'){drawNow();return}
  const items=menu.items,hint=menu.wait?'loading…':menu.top?'turn to choose · press to open':'turn to choose · press to select';
  let body;
  if(menu.rows){
    body=`<div class="erows">${items.map((it,i)=>`<div class="erow${i===menu.sel?' on':''}${it.dim?' dim':''}">${it.art?`<img src="${esc(it.art)}" alt="">`:`<div class="ea"><svg viewBox="0 0 24 24">${ICON[it.icon]||ICON.Podcast}</svg></div>`}<div><div class="tt">${esc(it.label)}</div>${it.note?`<div class="ts">${esc(it.note)}</div>`:''}</div></div>`).join('')}</div>`;
  }else{
    const cell=menu.top?chipHtml:tileHtml;
    body=`<div class="${menu.top?'chips':'tgrid'}">${items.map((it,i)=>it.mini?'':(it.group?`<div class="glabel">${esc(it.group)}</div>`:'')+cell(it,i)).join('')}</div>`;
    const mi=items.findIndex(x=>x.mini);
    if(mi>=0)body+=miniHtml(mi);
  }
  H('#msc',`<div class="mh"><span>${esc(menu.title)}</span><small>${hint}</small></div>${body}`);
  const on=$('#msc .on');if(on)on.scrollIntoView({block:'nearest'});
}
function drawNow(){
  const sel=menu.sel;menu.items=nowButtons();menu.sel=Math.min(sel,menu.items.length-1);
  const m=D.media||{},own=ownNow(),it=own?ownItem():null,fresh=own&&!(m.mine&&m.item&&it&&m.item.id===it.id);
  const title=fresh?it.title:(m.title||'Nothing playing');
  const sub=fresh?(it.kind==='station'?it.sub:it.show):(m.artist||'');
  const art=own?((it&&it.art)||''):artUrl;
  const src=own?(it&&it.kind==='station'?'Radio · live':'Podcast'+(it&&it.show?' · '+it.show:'')):(m.app||'Music')+' · '+(m.playing?'playing':'paused');
  const dur=m.dur||0,pct=dur>0?Math.min(100,(m.pos||0)/dur*100):0;
  const btns=menu.items.map((b,i)=>`<div class="b${i===menu.sel?' on':''}"><div class="c"><svg viewBox="0 0 24 24">${ICON[b.icon]||ICON.Music}</svg></div><div class="l">${esc(b.label)}</div></div>`).join('');
  H('#msc',`<div class="mh"><span>Now playing</span><small>turn to choose · press to select</small></div>
    <div class="now"><div class="nart">${art?`<img src="${esc(art)}" alt="">`:`<svg viewBox="0 0 24 24">${ICON[it&&it.kind==='station'?'Radio':'Music']}</svg>`}</div>
    <div class="ni"><div class="ns">${esc(src)}</div><div class="nt">${esc(title)}</div><div class="na">${esc(sub)}</div>
    ${dur>0?`<div class="prog"><b style="width:${pct.toFixed(1)}%"></b></div><div class="times"><span>${mmss(m.pos||0)}</span><span>${mmss(dur)}</span></div>`:''}
    ${!own&&m.title?`<div class="na" style="font-size:18px;color:var(--muted)">To choose something else in ${esc(m.app||'this app')}, use your phone when parked</div>`:''}
    <div class="nb">${btns}</div></div></div>`);
}

function videoMenu(){
  const it=[backTo(PAGES[page]==='Music'?musicMenu:settingsMenu)];
  menuData().videos.forEach(v=>it.push({label:v.title||'YouTube video',act(){
    const r=N.video(v.id||'',v.list||'');closeMenu();
    if(r==='moving')toast('Video only plays while parked');else if(r!=='sent')toast('Could not start the video')}}));
  openMenu('Video · parked only',it,1);
}
window.i3press=function(){
  if(menu){menuAlive();const it=menu.items[menu.sel];if(it&&it.act&&!it.dim)it.act();return}
  if(banner){const x=banner.x;banner=null;drawBanner();noteMenu(x);return}       // a message has just arrived: deal with it
  if(home){openCard(CARDS[homeSel]);return}
  sectionMenu();
};
function alertsMenu(){
  const it=start(),first=it.length,n=D.notes||[];
  it.push({label:'Read the latest aloud',note:String(n.length),act(){readAlerts();closeMenu()}});
  n.slice(0,6).forEach(x=>it.push({label:x.title||x.app,note:x.app,more:0,act(){noteMenu(x)}}));
  it.push({label:'Close menu',act:closeMenu});openMenu('Phone alerts',it,first);
}
// one message: hear it, answer it, or clear it from the phone
const QUICK=['Driving, will call you later','On my way','OK, thanks'];
function noteMenu(x){
  const it=[backTo(alertsMenu),{label:'Read aloud',act(){N.speak(said(x));menuAlive()}}];
  if(x.reply&&x.key){
    it.push({label:'Reply by voice',note:'speak',act(){hear('reply',x)}});

/* ---------- sat nav: MapLibre 3D map (OpenFreeMap), 2D fallback, OSRM routing ---------- */

const DEFAULT=[-2.035,49.195];
function mapMsg(t){const m=$('#mapmsg');m.textContent=t;m.hidden=!t}
function diag(t){if(_c.get('diag')===t)return;_c.set('diag',t);$('#diag').textContent=t;log('map: '+t)}
function webglOk(){try{const c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'))}catch(e){return false}}
/* The map has a light style for daylight and a dark one for night, chosen from where the sun is.
   A dark map can't be read on the car's screen in sunshine. */
const STYLE={day:'https://tiles.openfreemap.org/styles/liberty',night:'https://tiles.openfreemap.org/styles/dark'};
const FLAT={day:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',night:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'};
let dayMap=null,dayBroken=false,flatTiles=null,routeGeo=null,styleTimer=0;
// is the sun up (or nearly) at this place and time? Standard low-precision solar position, good to a degree
function sunUp(lat,lon,ms){
  const r=Math.PI/180,d=ms/864e5-10957.5;
  const g=(357.529+0.98560028*d)*r,L=(280.459+0.98564736*d+1.915*Math.sin(g)+0.020*Math.sin(2*g))*r,e=(23.439-0.00000036*d)*r;
  const ra=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),dec=Math.asin(Math.sin(e)*Math.sin(L));
  const ha=((18.697374558+24.06570982441908*d)*15+lon)*r-ra;
  return Math.asin(Math.sin(lat*r)*Math.sin(dec)+Math.cos(lat*r)*Math.cos(dec)*Math.cos(ha))/r>-4;
}
function wantDay(){if(dayBroken)return false;const t=store.get('theme','auto');if(t!=='auto')return t==='day';const p=pos||store.get('lastPos',DEFAULT);return sunUp(p[1],p[0],Date.now())}
function mapTheme(){
  const day=wantDay();if(day===dayMap)return;
  dayMap=day;document.body.classList.toggle('daymap',day);log('map theme: '+(day?'day':'night'));
  try{
    if(flatTiles)flatTiles.setUrl(day?FLAT.day:FLAT.night);
    if(map){
      map.setStyle(day?STYLE.day:STYLE.night);
      // if the daylight style never arrives, go back to the dark one that is known to work
      clearTimeout(styleTimer);
      if(day)styleTimer=setTimeout(()=>{try{if(map&&!map.isStyleLoaded()){dayBroken=true;diag('Daylight map did not load, using the dark map');mapTheme()}}catch(e){}},15000);
    }
  }catch(e){log('map theme: '+e.message)}
}
// our own layers on top of whichever style is showing: the route, 3D buildings and chargers
function addMapLayers(){
  if(!map)return;
  const day=!!dayMap;
  try{
    if(!map.getSource('route'))map.addSource('route',{type:'geojson',data:routeGeo||{type:'FeatureCollection',features:[]}});
    if(!map.getLayer('route-casing'))map.addLayer({id:'route-casing',type:'line',source:'route',paint:{'line-color':day?'#ffffff':'#0b3d91','line-width':13},layout:{'line-cap':'round','line-join':'round'}});
    if(!map.getLayer('route'))map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':day?'#1668e3':'#4c93ff','line-width':8},layout:{'line-cap':'round','line-join':'round'}});

    paint:{'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-color':day?'#d9d4cc':'#2a3646','fill-extrusion-height':['coalesce',['get','render_height'],6],'fill-extrusion-opacity':0.85}},'route-casing')}catch(e){log('3d buildings: '+e.message)}

    drawChargers()}catch(e){log('chargers layer: '+e.message)}
}
function startFlatMap(reason){

    const t=flatTiles=L.tileLayer(dayMap?FLAT.day:FLAT.night,{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'}).addTo(flat);
    t.on('tileerror',()=>diag('2D map: map pictures not loading — check mobile data'));

function startMap(){

function placeCamera(){

  if(flat){flat.setView([pos[1],pos[0]],route?17:16,{animate:false});return}

let lastSaved=0;
function onPosition(lat,lon,hd){

/* routing */
function hav(a,b){const r=Math.PI/180,dLa=(b[1]-a[1])*r,dLo=(b[0]-a[0])*r,s=Math.sin(dLa/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLo/2)**2;return 12742000*Math.asin(Math.sqrt(s))}
async function routeTo(lat,lon){
  const from=pos||store.get('lastPos',DEFAULT);
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${lon},${lat}?overview=full&geometries=geojson&steps=true`);
    const j=await r.json();if(!j.routes||!j.routes.length)throw new Error(j.message||'no route');
    const rt=j.routes[0],coords=rt.geometry.coordinates,cum=[0];
    for(let i=1;i<coords.length;i++)cum.push(cum[i-1]+hav(coords[i-1],coords[i]));
    const steps=[];let acc=0;for(const leg of rt.legs)for(const s of leg.steps){steps.push({at:acc,s});acc+=s.distance}
    const scale=cum[cum.length-1]/(acc||1);steps.forEach(x=>x.at*=scale);
    route={coords,cum,steps,total:cum[cum.length-1],dur:rt.duration,dest:[lon,lat],idx:0,along:0,off:0};spoken={};
    routeGeo={type:'Feature',geometry:rt.geometry};
    map&&map.getSource('route')&&map.getSource('route').setData(routeGeo);
    flatRoute&&flatRoute.setLatLngs(coords.map(c=>[c[1],c[0]]));
    $('#turn').hidden=false;$('#eta').hidden=false;navUpdate();
  }catch(e){log('route failed '+e.message);N.speak('Sorry, I could not find a route');}
}
window.i3navigate=(lat,lon,name)=>{home=false;page=PAGES.indexOf('Map');showPage();routeTo(lat,lon);if(name)N.speak('Navigating to '+name)};
window.i3recalc=()=>{if(route)routeTo(route.dest[1],route.dest[0])};
window.i3stopNav=()=>{route=null;routeGeo=null;$('#turn').hidden=true;$('#eta').hidden=true;map&&map.getSource('route')&&map.getSource('route').setData({type:'FeatureCollection',features:[]});flatRoute&&flatRoute.setLatLngs([]);placeCamera()};
function project(p){
  const R=route,c=R.coords,lat0=p[1]*Math.PI/180,kx=111320*Math.cos(lat0),ky=110540;let best={d:1e12,along:R.along,i:R.idx};
  for(let i=Math.max(0,R.idx-30);i<Math.min(c.length-1,R.idx+400);i++){
    const ax=(c[i][0]-p[0])*kx,ay=(c[i][1]-p[1])*ky,bx=(c[i+1][0]-p[0])*kx,by=(c[i+1][1]-p[1])*ky,dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
    let t=l2?-(ax*dx+ay*dy)/l2:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);
    if(d<best.d)best={d,i,along:R.cum[i]+t*(R.cum[i+1]-R.cum[i])}}
  return best;
}
const MOD={straight:0,'slight right':40,right:90,'sharp right':135,uturn:180,'sharp left':-135,left:-90,'slight left':-40};
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:n%10<4?n%10:0]);
function stepText(s){const m=s.maneuver,mod=m.modifier||'',road=s.name||s.ref||'',to=road?' onto '+road:'';
  switch(m.type){case'depart':return'Head off'+(road?' on '+road:'');case'arrive':return'Arrive at your destination';
    case'roundabout':case'rotary':return'At the roundabout, take the '+ord(m.exit||1)+' exit'+to;case'roundabout turn':return'At the roundabout, turn '+mod+to;
    case'fork':return'Keep '+(mod.includes('left')?'left':'right')+to;case'end of road':return'At the end of the road, turn '+mod+to;
    case'continue':case'new name':return!mod||mod==='straight'?'Continue'+(road?' on '+road:''):'Bear '+mod+to;
    default:return mod==='straight'?'Continue'+to:mod?'Turn '+mod+to:'Continue'+to}}
function fmtD(m){if(miles){const mi=m/1609.34;return mi<0.1?Math.max(10,Math.round(m*1.0936/10)*10)+' yd':mi<10?mi.toFixed(1)+' mi':Math.round(mi)+' mi'}return m<1000?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km'}
function navUpdate(){
  if(!route||!pos)return;
  const pr=project(pos);route.idx=pr.i;
  if(pr.d>70){if(++route.off>=4){route.off=0;log('off route');window.i3recalc();return}}else route.off=0;
  route.along=Math.max(route.along,pr.along);
  const rem=Math.max(0,route.total-route.along);
  if(rem<30){$('#turnD').textContent='Arrived';$('#turnI').textContent='';if(!spoken.arr){spoken.arr=1;N.speak('You have arrived');setTimeout(()=>{window.i3stopNav();N.navigationEnded()},8000)}return}
  const next=route.steps.find(x=>x.at>route.along+8)||route.steps[route.steps.length-1],dn=Math.max(0,next.at-route.along),txt=stepText(next.s);
  $('#turnD').textContent=fmtD(dn);$('#turnI').textContent=txt;
  const t=next.s.maneuver.type;$('#arrow').setAttribute('transform',t==='arrive'?'':`rotate(${MOD[next.s.maneuver.modifier]??0} 24 26)`);
  const key=Math.round(next.at);
  if(dn<400&&dn>120&&!spoken[key+'a']){spoken[key+'a']=1;N.speak('In '+fmtD(dn).replace('yd','yards').replace(' mi',' miles').replace(' km',' kilometres').replace(/(\d) m$/,'$1 metres')+', '+txt)}
  if(dn<=60&&!spoken[key+'b']){spoken[key+'b']=1;N.speak(txt)}
  const remSec=route.dur*rem/route.total;
  $('#eArr').textContent=new Date(Date.now()+remSec*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  $('#eRem').textContent=fmtD(rem);
  if(D.soc!=null){const arr=D.soc-(rem/1000/kmPerKwh())/USABLE_KWH*100;$('#eBat').textContent=f(Math.max(0,arr))+'%';$('#eBat').style.color=arr<10?'var(--bad)':arr<20?'var(--warn)':'var(--good)'}
}
log('i3 Dash page ready '+innerWidth+'x'+innerHeight);
showPage();
</script>
