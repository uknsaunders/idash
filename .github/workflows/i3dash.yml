name: i3 Dash

# Builds the installable i3 Dash app every time the code changes,
# and publishes it on the "latest" release page for downloading on the phone.
on:
  push:
    # main publishes the app; the other branches are only built and checked, and their app kept with the run
    branches: [main, android-auto]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch version tags from the original project
        run: |
          git remote add upstream https://github.com/BimmerGestalt/AAIdrive.git || true
          git fetch --tags upstream || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Prepare cached external dependencies
        uses: actions/cache@v4
        with:
          key: aaidrive_external_${{ hashFiles('.github/actions/download-externals-action/download.sh') }}
          path: |
            external

      - name: Download build dependencies
        uses: ./.github/actions/download-externals-action

      - name: Build i3 Dash
        env:
          W3W_API_KEY: ${{ secrets.W3W_API_KEY }}
          # a Spotify Client ID (not a secret, but kept out of the code) so Spotify can be listed and searched
          AndroidAutoIdrive_SpotifyApiKey: ${{ secrets.ANDROIDAUTOIDRIVE_SPOTIFYAPIKEY }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleNomapNonalyticsFullDebug assembleNomapNonalyticsAaDebug --stacktrace 2>&1 | tee build.log

      - name: Run the Android Auto checks
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testNomapNonalyticsFullDebugUnitTest --tests 'me.hufman.androidautoidrive.androidauto.*' 2>&1 | tee test.log

      - name: Show what went wrong
        if: failure()
        shell: bash
        run: |
          # compiler errors and failed checks become notes on the run, readable without signing in
          for f in build.log test.log; do
            [ -f "$f" ] || continue
            grep -E '^e: |error:|FAILED|Exception|Expected|AssertionError' "$f" | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
          done

      - name: Name the app file
        run: |
          mkdir dist
          cp app/build/outputs/apk/nomapNonalyticsFull/debug/*.apk dist/i3-dash.apk
          cp app/build/outputs/apk/nomapNonalyticsAa/debug/*.apk dist/i3-android-auto.apk
          ls -la dist

      - name: Keep a copy with this build
        uses: actions/upload-artifact@v4
        with:
          name: i3-dash
          path: dist/i3-dash.apk
          retention-days: 14

      - name: Keep a copy of the Android Auto app with this build
        uses: actions/upload-artifact@v4
        with:
          name: i3-android-auto
          path: dist/i3-android-auto.apk
          retention-days: 14

      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: i3dash-latest
          name: i3 Dash (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest i3 Dash build from commit ${{ github.sha }}.
            Download **i3-dash.apk** on your phone and open it to install.
          files: dist/i3-dash.apk

      - name: Publish the Android Auto app
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-auto-latest
          name: i3 Android Auto (latest build)
          prerelease: true
          make_latest: false
          body: |
            Latest i3 Android Auto build from commit ${{ github.sha }}.
            A separate app from i3D, built from the same code: your phone's Android Auto on the iDrive screen.
            Download **i3-android-auto.apk** on your phone and open it to install.
          files: dist/i3-android-auto.apk
